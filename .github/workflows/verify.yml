name: verify
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build browser packages
        run: python build.py
      - name: Run security and regression tests
        run: node --test tests/a0-security.test.mjs
      - name: Verify Edge store package
        run: |
          python -c "import json, zipfile; p='dist/chatgpt-export-edge-addons-0.7.0.zip'; z=zipfile.ZipFile(p); m=json.loads(z.read('manifest.json')); assert '<all_urls>' not in str(m); assert 'https://*.oaiusercontent.com/*' in m['optional_host_permissions']; assert 'src/content.js' in z.namelist(); print('Edge package verified:', p)"
